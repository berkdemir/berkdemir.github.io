{{- $videoExts := slice "mp4" "webm" "ogg" "mov" "avi" -}}
{{- $ext := lower (path.Ext .Destination | strings.TrimPrefix ".") -}}
{{- if in $videoExts $ext -}}
<video controls style="max-width:100%">
  <source src="{{ .Destination }}" type="video/{{ $ext }}">
</video>
{{- else -}}
<img src="{{ .Destination }}" alt="{{ .Text }}"{{ with .Title }} title="{{ . }}"{{ end }}>
{{- end -}}
